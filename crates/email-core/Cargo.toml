# crates/email-core/Cargo.toml
[package]
name = "email-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable IMAP, SMTP, OAuth2, MIME parsing, auto-discovery, and email threading engines for Rust."


[dependencies]
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["full", "macros"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
sha2 = "0.10"
url = "2"
mail-parser = "0.9"
ammonia = "4"
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "rustls-tls",
    "tokio1-rustls",
    "builder",
    "smtp-transport",
    "hostname"
] }
# Added for Provider Auto-Discovery
roxmltree = "0.20"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
mailparse = "0.14"
tracing = "0.1"
zeroize = "1.8"
crypto = { path = "../crypto" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

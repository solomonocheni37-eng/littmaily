[package]
name = "tauri-app"
version = "0.1.4"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [ "devtools", "tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
email-core = { path = "../email-core" }
storage = { path = "../storage" }
caldav = { path = "../caldav" }
carddav = { path = "../carddav" }
crypto = { path = "../crypto" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
open = "5"
ammonia = "4"
lol_html = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript", "derive"] }
specta-typescript = "=0.0.12"
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rustls = { version = "0.23", features = ["ring"] }
futures = "0.3"
tauri-plugin-deep-link = "2"
zeroize = "1.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

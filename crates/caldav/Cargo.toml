# crates/caldav/Cargo.toml
[package]
name = "caldav"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async CalDAV client with RFC 6578 sync-collection, RFC 6764 discovery, and robust iCalendar parsing."

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
url = "2"
roxmltree = "0.20"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
wiremock = "0.6"

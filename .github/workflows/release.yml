name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # GUARD: the git tag MUST match tauri.conf.json and Cargo.toml versions.
      # tauri-action names the release from tauri.conf.json, not from the tag,
      # so a mismatch silently publishes assets under the wrong tag.
      - name: verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./crates/tauri-app/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version = ' crates/tauri-app/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG conf=$CONF cargo=$CARGO"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Version mismatch: tag v$TAG vs tauri.conf.json $CONF vs Cargo.toml $CARGO"
            exit 1
          fi

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Repeat releases skip recompiling the whole workspace (big win with
      # vendored SQLCipher/OpenSSL in the dependency tree).
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./crates/tauri-app -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # npm ci (not npm install): installs exactly what package-lock.json pins,
      # so shipped bundles are reproducible from the commit.
      - name: install frontend dependencies
        run: npm ci --prefix frontend

      - name: build frontend manually
        # We build the frontend here because tauri.conf.json's beforeBuildCommand
        # expects to run in the root directory, but tauri-action executes it
        # relative to the projectPath (crates/tauri-app).
        run: npm run build --prefix frontend

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # REQUIRED: Signs the update bundles so the app trusts the download
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Littmaily v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          projectPath: "./crates/tauri-app"
          args: ${{ matrix.args }}

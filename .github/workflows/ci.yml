name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build

  rust-libs:
    name: Rust protocol crates (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test protocol crates
        run: cargo test --workspace --exclude tauri-app

  tauri-app:
    name: Tauri app (clippy + tests + specta drift)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK/GTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Ratchet: warnings tolerated until the legacy surface is cleaned in a
      # dedicated commit; then flip to `-- -D warnings`.
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets
      - name: Tests (incl. specta export + outbox worker)
        run: cargo test -p tauri-app
      - name: Specta bindings drift gate
        run: git diff --exit-code -- frontend/src/core/types/generated.ts
